apiVersion: v1
kind: Secret
metadata:
  name: retriever-secret
  labels:
    app: retriever
type: Opaque
stringData:
  # WARNING: Replace 'your_gemini_key_here' with your actual API key before deploying
  # Never commit the actual API key to version control.
  RETRIEVER_GEMINI_API_KEY: "your_gemini_key_here"
  RETRIEVER_OPENAI_API_KEY: ""

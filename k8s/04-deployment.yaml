apiVersion: apps/v1
kind: Deployment
metadata:
  name: retriever
  labels:
    app: retriever
spec:
  replicas: 2 # Demonstrate horizontal scaling (Day 43 concept)
  selector:
    matchLabels:
      app: retriever
  template:
    metadata:
      labels:
        app: retriever
    spec:
      containers:
        - name: retriever
          image: retriever:latest
          imagePullPolicy: IfNotPresent # Use local image built for minikube/kind
          ports:
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: retriever-config
            - secretRef:
                name: retriever-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          # Senior Level: Native gRPC Probes (Kubernetes 1.24+)
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          # Expert Level: PreStop Hook for Zero-Downtime Rollouts
          # Gives kube-proxy time to remove the pod from the iptables endpoints
          # BEFORE the Go application starts its graceful shutdown.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          # Expert Level: Stringent Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
      # Expert Level: Ensure High Availability across nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: retriever
      # Wait for postgres to be ready
      initContainers:
        - name: init-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          command: ['sh', '-c', 'until nc -z retriever-postgres 5432; do echo waiting for postgres; sleep 2; done;']

